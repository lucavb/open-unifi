name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    needs: web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # go:embed needs the console bundle; the web job builds it (AGENTS.md).
      - name: Download console bundle
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: internal/adminapi/static/dist

      # check job only — lint is a separate job (see AGENTS.md).
      - name: Module gate
        run: make check

  build:
    needs: web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download console bundle
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: internal/adminapi/static/dist

      - name: Build
        run: go build -v ./...

  lint:
    needs: web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download console bundle
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: internal/adminapi/static/dist

      # Not covered by make check — agents must run this locally too (AGENTS.md).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console bundle is build output, never committed: this job
      # builds it from web/ and hands it to the Go jobs, whose go:embed
      # needs it on disk (AGENTS.md).
      - name: Build console bundle
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Upload console bundle
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: internal/adminapi/static/dist
          if-no-files-found: error

  docker:
    needs: [check, build, lint, web]
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
